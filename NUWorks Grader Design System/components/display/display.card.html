<!DOCTYPE html>
<html><head>

<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text)}a{color:var(--accent)}a:hover{color:var(--accent-hover)}</style>

<div id="root"></div>
<script type="text/babel">
const { Badge, ScoreBar, StatCard, JobCard, FeatureCard, ProgressBar, Spinner, Toast, Button } = window.NUWorksGraderDesignSystem_866ea6;
function Card() {
  return (
    <div style={{padding:16, display:"flex", flexDirection:"column", gap:14}}>
      <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
        <Badge variant="score-high">82% Match</Badge>
        <Badge variant="score-medium">54%</Badge>
        <Badge variant="score-low">21%</Badge>
        <Badge variant="skill-matched">Python</Badge>
        <Badge variant="skill-missing">Kubernetes</Badge>
        <Badge variant="external">External</Badge>
        <Badge variant="disqualified">Ineligible</Badge>
        <Badge variant="accent">Version 1.7</Badge>
        <Badge variant="moss">For Northeastern</Badge>
        <Badge variant="neutral">Co-op</Badge>
      </div>
      <div style={{display:"flex", gap:10}}>
        <StatCard value="412" label="Total Fetched" />

        <StatCard value="96" label="40-69% Match" color="var(--score-med-text)" />

        <div style={{flex:1}}><ProgressBar progress={45} status="Fetching jobs..." count="180 / 400" /></div>
        <Spinner />
        <Toast show>Saved 12 jobs</Toast>

}
ReactDOM.createRoot(document.getElementById("root")).render(<Card />);
</script>
