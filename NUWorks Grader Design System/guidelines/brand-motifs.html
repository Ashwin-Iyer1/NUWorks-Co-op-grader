<!-- @dsCard group="Brand" viewport="700x150" name="Signature Motifs" subtitle="Soft shadow cards, tinted chips, serif italics" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);padding:20px 22px;display:flex;gap:18px;align-items:center}a{color:var(--accent)}
.lbl{font-size:0.72rem;color:var(--text-muted);display:block;margin-top:8px;text-align:center}</style></head><body>
<div><div style="width:120px;height:64px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md)"></div><span class="lbl">card: 14px + soft shadow</span></div>
<div><div style="width:38px;height:38px;background:var(--accent-muted);color:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:13px auto"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div><span class="lbl">tinted icon chip</span></div>
<div><div style="font-family:var(--font-serif);font-size:1.5rem;padding:14px 0;text-align:center">the ones that <em style="color:var(--accent)">actually fit</em></div><span class="lbl">italic clay accent words</span></div>
<div><div style="width:120px;height:64px;background:var(--bg-surface);border:1px solid var(--border);border-radius:14px"></div><span class="lbl">tinted band sections</span></div>
</body></html>
