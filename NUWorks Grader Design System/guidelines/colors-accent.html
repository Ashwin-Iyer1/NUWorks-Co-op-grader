<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);display:flex;gap:10px;padding:16px}a{color:var(--accent)}
.sw{flex:1;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;height:118px;box-sizing:border-box;box-shadow:var(--shadow-sm)}
.n{font-size:0.78rem;font-weight:600}
.v{font-size:0.72rem;opacity:0.8}</style></head><body>
<div class="sw" style="background:#b4400f;color:#fff"><span class="n">Clay</span><span class="v">#b4400f</span></div>
<div class="sw" style="background:#983508;color:#fff"><span class="n">Clay hover</span><span class="v">#983508</span></div>
<div class="sw" style="background:#f6e8e0;color:#983508"><span class="n">Clay tint</span><span class="v">#f6e8e0</span></div>
<div class="sw" style="background:#d96a35;color:#fff"><span class="n">Dark-mode clay</span><span class="v">#d96a35</span></div>
<div class="sw" style="background:#4d6a4a;color:#fff"><span class="n">Moss (secondary)</span><span class="v">#4d6a4a</span></div>
<div class="sw" style="background:#e9efe7;color:#3f5d3c"><span class="n">Moss tint</span><span class="v">#e9efe7</span></div>
</body></html>
