<!-- @dsCard group="Colors" viewport="700x150" name="Dark Mode" subtitle="Ember by lamplight — warm charcoal, softened clay" -->
<!DOCTYPE html>
<html data-theme="dark"><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);display:flex;gap:10px;padding:16px}a{color:var(--accent)}
.sw{flex:1;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;height:118px;box-sizing:border-box;color:#ece6da}
.n{font-size:0.78rem;font-weight:600}
.v{font-size:0.72rem;opacity:0.7}</style></head><body>
<div class="sw" style="background:#1d1a15"><span class="n">bg-base</span><span class="v">#1d1a15</span></div>
<div class="sw" style="background:#17140f"><span class="n">bg-surface</span><span class="v">#17140f</span></div>
<div class="sw" style="background:#26221b"><span class="n">bg-card</span><span class="v">#26221b</span></div>
<div class="sw" style="background:#d96a35;color:#1d1a15"><span class="n">clay</span><span class="v">#d96a35</span></div>
<div class="sw" style="background:#8fae8b;color:#1d1a15"><span class="n">moss</span><span class="v">#8fae8b</span></div>
<div class="sw" style="background:#26221b;color:#b3aa99;border-color:#4a4438"><span class="n">secondary text</span><span class="v">#b3aa99</span></div>
</body></html>
