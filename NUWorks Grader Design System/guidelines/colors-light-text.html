<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);display:flex;gap:10px;padding:16px}a{color:var(--accent)}
.sw{flex:1;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;height:118px;box-sizing:border-box;color:#26221c}
.n{font-size:0.78rem;font-weight:600}
.v{font-size:0.72rem;opacity:0.7}</style></head><body>
<div class="sw" style="background:#faf7f2"><span class="n">bg-base</span><span class="v">#faf7f2</span></div>
<div class="sw" style="background:#f1ece3"><span class="n">bg-surface</span><span class="v">#f1ece3</span></div>
<div class="sw" style="background:#ffffff"><span class="n">bg-card</span><span class="v">#ffffff</span></div>
<div class="sw" style="background:#26221c;color:#ece6da"><span class="n">text</span><span class="v">#26221c</span></div>
<div class="sw" style="background:#5f584d;color:#faf7f2"><span class="n">secondary</span><span class="v">#5f584d</span></div>
<div class="sw" style="background:#948c7d;color:#faf7f2"><span class="n">muted</span><span class="v">#948c7d</span></div>
</body></html>
