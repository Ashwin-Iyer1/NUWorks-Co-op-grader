<!-- @dsCard group="Colors" viewport="700x150" name="Score Semantics" subtitle="Moss / amber / brick — ONLY for match scoring & status" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);display:flex;gap:16px;padding:22px 18px;align-items:center}a{color:var(--accent)}
.pill{display:inline-flex;padding:3px 12px;border-radius:999px;font-weight:600;font-size:0.78rem}
.bar{width:100%;height:5px;background:var(--bg-surface);border-radius:3px;overflow:hidden}
.col{flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.lbl{font-size:0.72rem;color:var(--text-muted)}</style></head><body>
<div class="col"><span class="lbl">High &ge;70%</span><span class="pill" style="background:var(--green-muted);color:var(--score-high-text)">82% match</span><div class="bar"><div style="width:82%;height:100%;background:var(--green);border-radius:3px"></div></div></div>
<div class="col"><span class="lbl">Medium 40&ndash;69%</span><span class="pill" style="background:var(--yellow-muted);color:var(--score-med-text)">54% match</span><div class="bar"><div style="width:54%;height:100%;background:var(--yellow);border-radius:3px"></div></div></div>
<div class="col"><span class="lbl">Low &lt;40%</span><span class="pill" style="background:var(--red-muted);color:var(--score-low-text)">21% match</span><div class="bar"><div style="width:21%;height:100%;background:var(--red);border-radius:3px"></div></div></div>
<div class="col"><span class="lbl">Skills</span><span class="pill" style="background:var(--accent-muted);color:var(--skill-matched-text);font-size:0.74rem;padding:2px 10px">Matched</span><span class="pill" style="background:var(--red-muted);color:var(--skill-missing-text);font-size:0.74rem;padding:2px 10px">Missing</span></div>
</body></html>
