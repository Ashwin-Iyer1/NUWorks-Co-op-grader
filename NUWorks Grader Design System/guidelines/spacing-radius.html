<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Depth" subtitle="8px controls, 14px cards, pill badges; soft shadows do the depth" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);padding:20px 22px;display:flex;gap:18px;align-items:center}a{color:var(--accent)}
.lbl{font-size:0.72rem;color:var(--text-muted);display:block;margin-top:7px;text-align:center}</style></head><body>
<div><div style="width:96px;height:58px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-sm)"></div><span class="lbl">radius-sm 8px</span></div>
<div><div style="width:96px;height:58px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)"></div><span class="lbl">radius-lg 14px</span></div>
<div><div style="display:flex;justify-content:center;padding:18px 0"><span style="padding:3px 12px;background:var(--green-muted);color:var(--score-high-text);border-radius:999px;font-size:0.78rem;font-weight:600">82% match</span></div><span class="lbl">pills: fully round</span></div>
<div><div style="width:96px;height:58px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md)"></div><span class="lbl">hover: shadow-md, -2px</span></div>
<div><div style="width:96px;height:58px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg)"></div><span class="lbl">modals: shadow-lg</span></div>
</body></html>
