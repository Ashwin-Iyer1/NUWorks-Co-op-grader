<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing In Use" subtitle="Comfortable forms: 6px label gap, 9px field padding, 18px card gaps" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);padding:18px 22px;display:flex;gap:36px}a{color:var(--accent)}
label{display:block;margin-bottom:6px;font-size:0.8rem;color:var(--text-secondary);font-weight:600}
input{width:190px;padding:9px 12px;background:var(--input-bg);border:1px solid var(--border-hover);border-radius:8px;color:var(--text);font-size:0.9rem;font-family:var(--font-sans);box-shadow:var(--shadow-sm)}
.k{font-size:0.78rem;color:var(--text-muted)}</style></head><body>
<div>
<div style="margin-bottom:14px"><label>Jobs to fetch</label><input value="200" readonly></div>
<div><label>Days since posted</label><input value="30" readonly></div>
</div>
<div style="display:flex;flex-direction:column;gap:7px;justify-content:center">
<span class="k">form group gap — 14px</span>
<span class="k">label → field — 6px</span>
<span class="k">field padding — 9px 12px</span>
<span class="k">card padding — 18px (26px marketing)</span>
<span class="k">grid gaps — 18px &middot; section gap — 84px</span>
</div>
</body></html>
