<!-- @dsCard group="Type" viewport="700x150" name="Labels, Eyebrows & Buttons" subtitle="Sans 600 sentence case; eyebrow is the one uppercase style" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-base);font-family:var(--font-sans);color:var(--text);padding:22px;display:flex;flex-direction:column;gap:16px}a{color:var(--accent)}</style></head><body>
<div style="display:flex;gap:36px;align-items:baseline">
<span style="font-size:0.8rem;color:var(--text-secondary);font-weight:600">Jobs to fetch</span>
<span style="font-size:0.72rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--moss)">For Northeastern co-op students</span>
<span style="font-size:0.78rem;color:var(--text-muted)">form label &larr; &middot; &rarr; eyebrow (moss, 0.14em)</span>
</div>
<div style="display:flex;gap:12px;align-items:center">
<span style="background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;font-size:0.9rem;font-weight:600;box-shadow:var(--shadow-sm)">Add to Chrome — it's free</span>
<span style="border:1px solid var(--border-strong);color:var(--text);padding:10px 22px;border-radius:8px;font-size:0.9rem;font-weight:600">See how it works</span>
<span style="background:var(--accent-muted);color:var(--accent);padding:4px 14px;border-radius:999px;font-size:0.76rem;font-weight:600">Version 1.7</span>
</div>
</body></html>
